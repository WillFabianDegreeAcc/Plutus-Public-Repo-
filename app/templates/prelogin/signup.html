<form class="nav-panel" action="{{ url_for('main.signup') }}" method="post">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <p>Public sign-up creates an administrator in a new, isolated group. Joining an existing group requires an invitation.</p>
    <label for="nav-name">Full name</label>
    <input id="nav-name" name="name" type="text" placeholder="Jane Doe" required>

    <label for="nav-signup-email">Email</label>
    <input id="nav-signup-email" name="email" type="email" placeholder="janedoe@example.com" required>

    <label for="nav-signup-password">Password</label>
    <input id="nav-signup-password" name="password" type="password" placeholder="Create a password" minlength="12" maxlength="128" required>
    <p>Use 12–128 characters with uppercase and lowercase letters, a number, and a symbol.</p>

    <button type="submit">Sign up</button>
</form>
