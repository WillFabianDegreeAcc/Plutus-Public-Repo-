name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install bandit pip-audit pytest pytest-cov ruff

      - name: Lint
        run: ruff check --select E,F --ignore E501,E302 .

      - name: Test with coverage
        run: python -m pytest --cov=app --cov-report=term-missing --cov-report=xml:coverage.xml --junitxml=test-results.xml

      - name: Upload test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-and-coverage-results
          path: |
            coverage.xml
            test-results.xml

      - name: Check application security
        run: bandit --recursive app seed.py wsgi.py

      - name: Audit dependencies
        run: pip-audit --requirement requirements.txt
