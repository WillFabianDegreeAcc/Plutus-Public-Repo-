services:
  - type: web
    name: plutus
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn wsgi:app --bind 0.0.0.0:$PORT
    healthCheckPath: /
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: plutus-db
          property: connectionString

databases:
  - name: plutus-db
    plan: free
    ipAllowList: []
